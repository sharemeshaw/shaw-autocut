<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shaw-autocut · 字幕审核</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1f; --mute:#8a8a8e; --line:#e6e6e3; --acc:#1c64f2; --warn:#d9480f; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { display:grid; grid-template-columns:minmax(260px,380px) 1fr; height:100vh; }
  aside { padding:16px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:12px; }
  .stage { position:relative; background:#000; border-radius:8px; overflow:hidden; }
  video { width:100%; display:block; max-height:62vh; }
  .cap { position:absolute; left:6%; right:6%; bottom:12%; text-align:center; color:#fff; font-weight:600; font-size:clamp(14px,2.4vw,20px); text-shadow:0 0 3px #000,0 0 3px #000,0 0 3px #000; pointer-events:none; }
  h1 { font-size:16px; margin:0; }
  .stats { font-size:13px; color:var(--mute); }
  .bar { display:flex; gap:8px; flex-wrap:wrap; }
  button { font:inherit; font-size:13px; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:var(--card); cursor:pointer; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  .hint { font-size:12px; color:var(--mute); }
  main { overflow-y:auto; padding:16px 20px 80px; }
  .row { display:flex; gap:10px; align-items:center; padding:6px 10px; margin-bottom:4px; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  .row.on { border-color:var(--acc); box-shadow:0 0 0 2px #d6e4ff; }
  .t { font:12px ui-monospace,Menlo,Consolas,monospace; color:var(--mute); width:150px; flex:none; white-space:nowrap; cursor:pointer; }
  .t:hover { color:var(--acc); }
  .text { flex:1; outline:none; padding:2px 4px; border-radius:4px; }
  .text:focus { background:#fffbe6; }
  .text.edited { background:#fff4e6; }
  .long { color:var(--warn); font-size:12px; flex:none; }
  .del { border:none; background:none; color:var(--mute); cursor:pointer; font-size:16px; padding:0 4px; }
  .del:hover { color:var(--warn); }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1d1d1f; color:#fff; padding:8px 16px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; }
  .toast.show { opacity:1; }
  @media (max-width:760px){ .wrap{grid-template-columns:1fr;height:auto} aside{border-right:none} }
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <h1 id="name"></h1>
    <div class="stage"><video id="v" controls preload="metadata"></video><div class="cap" id="cap"></div></div>
    <div class="stats" id="stats"></div>
    <div class="bar">
      <button id="save">保存</button>
      <button id="done" class="primary">审核完成 ✓</button>
    </div>
    <div class="hint">点时间码跳到该句播放 · 直接点文字改错字，回车确认 · × 删除该条 · 橙色提示表示一行偏长 · 空格 播放/暂停</div>
  </aside>
  <main id="list"></main>
</div>
<div class="toast" id="toast"></div>
<script>
const DATA = /*__DATA__*/null;
const SERVED = location.protocol.startsWith("http");
const cues = DATA.cues.map((c,i)=>({...c, orig:c.text, id:i}));
const v = document.getElementById("v"), cap = document.getElementById("cap");
v.src = DATA.video;
document.getElementById("name").textContent = "字幕审核 · " + DATA.name;
const fmt = t => { const m=Math.floor(t/60), s=(t%60).toFixed(2).padStart(5,"0"); return `${m}:${s}`; };
const dlen = s => [...s].reduce((n,ch)=>n+(ch.charCodeAt(0)<128?0.5:1),0);
const toast = m => { const el=document.getElementById("toast"); el.textContent=m; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),1800); };
function stats(){ const ed=cues.filter(c=>!c.removed&&c.text!==c.orig).length, rm=cues.filter(c=>c.removed).length;
  document.getElementById("stats").textContent = `共 ${cues.length-rm} 条 · 已改 ${ed} · 已删 ${rm}` + (DATA.reviewed?" · 已审核":""); }
function render(){
  const list=document.getElementById("list"); list.innerHTML="";
  for (const c of cues) { if (c.removed) continue;
    const row=document.createElement("div"); row.className="row"; row.dataset.id=c.id;
    row.innerHTML=`<span class="t">${fmt(c.start)} → ${fmt(c.end)}</span><span class="text" contenteditable="true" spellcheck="false"></span><span class="long"></span><button class="del" title="删除这条">×</button>`;
    const tx=row.querySelector(".text"), lg=row.querySelector(".long"); tx.textContent=c.text;
    const mark=()=>{ tx.classList.toggle("edited",c.text!==c.orig); tx.title=c.text!==c.orig?"识别原文："+c.orig:""; lg.textContent=dlen(c.text)>DATA.max_chars?"偏长":""; };
    mark();
    row.querySelector(".t").onclick=()=>{ v.currentTime=c.start+0.01; v.play(); };
    tx.oninput=()=>{ c.text=tx.textContent.replace(/\n/g,""); mark(); stats(); };
    tx.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); tx.blur(); } };
    row.querySelector(".del").onclick=()=>{ c.removed=true; render(); };
    list.appendChild(row);
  }
  stats();
}
v.addEventListener("timeupdate",()=>{ const t=v.currentTime; const c=cues.find(c=>!c.removed&&t>=c.start&&t<c.end);
  cap.textContent=c?c.text:""; document.querySelectorAll(".row.on").forEach(r=>r.classList.remove("on"));
  if(c){ const r=document.querySelector(`.row[data-id="${c.id}"]`); if(r){ r.classList.add("on"); } } });
document.addEventListener("keydown",e=>{ if(e.code==="Space"&&!document.activeElement.classList.contains("text")){ e.preventDefault(); v.paused?v.play():v.pause(); } });
const pad=(n,w=2)=>String(n).padStart(w,"0");
const ts=t=>{ const ms=Math.round(t*1000); return `${pad(Math.floor(ms/3600000))}:${pad(Math.floor(ms/60000)%60)}:${pad(Math.floor(ms/1000)%60)},${pad(ms%1000,3)}`; };
const toSrt=()=>cues.filter(c=>!c.removed&&c.text.trim()).map((c,i)=>`${i+1}\n${ts(c.start)} --> ${ts(c.end)}\n${c.text.trim()}\n`).join("\n");
async function persist(finish){
  const srt=toSrt();
  if (SERVED) { const r=await fetch("/api/srt"+(finish?"?finish=1":""),{method:"POST",headers:{"Content-Type":"text/plain; charset=utf-8"},body:srt});
    if(!r.ok){ toast("保存失败"); return; }
    if(finish) DATA.reviewed=true;
    toast(finish?"已提交，可以关闭页面，回到 Agent / 终端继续":"已保存"); }
  else { const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([srt],{type:"text/plain"})); a.download=DATA.srt_name; a.click();
    toast("已下载 "+DATA.srt_name+"，请覆盖原文件"); }
  stats();
}
document.getElementById("save").onclick=()=>persist(false);
document.getElementById("done").onclick=()=>persist(true);
render();
</script>
</body>
</html>
