<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四种字幕样式 · 相同画面比例示意</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 2632px; margin: 0; }
  body { padding: 24px; background: #fff; color: #24292f; font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  .grid { display: grid; grid-template-columns: 1280px 1280px; gap: 24px; }
  .label { height: 52px; font-size: 36px; line-height: 52px; font-weight: 700; }
  .video { position: relative; width: 1280px; height: 720px; background: #a5b6c0; overflow: hidden; }
  .video img { position: absolute; width: 1280px; height: 720px; object-fit: contain; }
  .subtitle { position: absolute; left: 15%; width: 70%; bottom: 8%; text-align: center; font-size: 32px; line-height: 1.3; }
  .subtitle span { display: inline-block; }
  .clean span { color: #fff; font-weight: 700; -webkit-text-stroke: 1.6px #000; text-shadow: 0 1px 2px rgba(0,0,0,.55); }
  .box span { color: #fff; font-weight: 500; background: rgba(0,0,0,.55); padding: 2px 10px; }
  .yellow span { color: #ffe45c; font-weight: 700; -webkit-text-stroke: 1.9px #1f1f1f; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .minimal span { color: #fff; font-weight: 500; text-shadow: 0 0 4px rgba(0,0,0,.9), 0 0 8px rgba(0,0,0,.35); }
</style>
<div class="grid">
  <section><div class="label">clean · 白字描边</div><div class="video"><img src="02-demo-talking-head.png" alt=""><div class="subtitle clean"><span>字幕先由你审核</span></div></div></section>
  <section><div class="label">box · 半透明底框</div><div class="video"><img src="02-demo-talking-head.png" alt=""><div class="subtitle box"><span>字幕先由你审核</span></div></div></section>
  <section><div class="label">yellow · 暖黄字</div><div class="video"><img src="02-demo-talking-head.png" alt=""><div class="subtitle yellow"><span>字幕先由你审核</span></div></div></section>
  <section><div class="label">minimal · 柔光白字</div><div class="video"><img src="02-demo-talking-head.png" alt=""><div class="subtitle minimal"><span>字幕先由你审核</span></div></div></section>
</div>
</html>
